name: Sincronizar ranking

on:
  schedule:
    # A cada 5 minutos — o mínimo confiável do GitHub Actions.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-ranking
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Baixar Excel do OneDrive
        env:
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
        run: node scripts/fetch-source.mjs

      - name: Gerar ranking.json
        run: node scripts/sync.mjs data/source/onedrive-download.xlsx

      - name: Publicar se o ranking mudou
        run: |
          if git diff --quiet -- public/data/ranking.json; then
            echo "Sem mudanças no ranking."
          else
            git config user.name "ranking-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data/ranking.json
            git commit -m "chore: sincroniza ranking a partir do Excel"
            git push
          fi
